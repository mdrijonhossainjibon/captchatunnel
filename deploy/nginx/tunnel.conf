# ---------------------------------------------------------------------------
# CaptchaTunnel reverse proxy (Nginx)
# ---------------------------------------------------------------------------
# Terminates TLS for *.redy.captchamaster.org and forwards HTTP(S) to the
# tunnel server's HTTP ingress (server:8080). The tunnel server resolves the
# subdomain from the Host header and relays to the right tunnel.
#
# TCP tunnels do NOT pass through Nginx: the tunnel server listens on its own
# TCP port range (10000-10100) directly.
# ---------------------------------------------------------------------------

# For WebSocket upgrades, forward "upgrade"; otherwise close the upstream
# connection after each request so the transparent relay knows when the
# response has finished.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP -> HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name redy.captchamaster.org *.redy.captchamaster.org;

    # ACME HTTP-01 challenge (unused for DNS-01 wildcard certs, kept for
    # renewal flexibility).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ingress ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name redy.captchamaster.org *.redy.captchamaster.org;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 fallback, TLS 1.3 preferred by clients.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Long-lived streams (WebSocket, SSE, long polling).
    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    location / {
        proxy_pass http://server:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Relay raw bytes; do not buffer upstream responses or request bodies.
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
