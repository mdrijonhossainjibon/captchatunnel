# CaptchaTunnel server - Docker Compose (Coolify / Cloudflare origin setup).
#
# This is the Compose file Coolify finds by default (must be named
# docker-compose.yaml at the repo root).
#
# Deploy in Coolify:
#   1. Resources -> + New -> Docker Compose -> Git Repository
#   2. Repo: mdrijonhossainjibon/captchatunnel (branch main)
#      Compose file is auto-detected at /docker-compose.yaml
#   3. Set environment variable CAPTCHATUNNEL_TOKEN in the resource.
#   4. Deploy.
#
# Public ports:
#   - 4443        : control channel (clients connect here, TLS)
#   - 2086        : HTTP ingress. Cloudflare terminates TLS for
#                   *.redy.captchamaster.org and forwards to this port.
#   - 10000-10100 : public TCP tunnels (direct)
#
# A self-signed control-channel certificate is generated on first run by the
# image entrypoint, so no host file mounts are required.

services:
  server:
    image: captchamaster/captchatunnel-server:1.0.0
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      # CAPTCHATUNNEL_TOKEN is OPTIONAL. Leave it unset for no-auth mode
      # (any client may open a tunnel). Set it to require a token.
      # CAPTCHATUNNEL_TOKEN: set-me-to-enforce-auth
      CAPTCHATUNNEL_BASE_DOMAIN: ${CAPTCHATUNNEL_BASE_DOMAIN:-redy.captchamaster.org}
      CAPTCHATUNNEL_PUBLIC_ADDR: ${CAPTCHATUNNEL_PUBLIC_ADDR:-redy.captchamaster.org}
      CAPTCHATUNNEL_CONTROL_ADDR: 0.0.0.0:4443
      CAPTCHATUNNEL_HTTP_ADDR: 0.0.0.0:8080
      CAPTCHATUNNEL_TCP_ADDR: 0.0.0.0
      CAPTCHATUNNEL_TCP_PORT_MIN: 10000
      CAPTCHATUNNEL_TCP_PORT_MAX: 10100
      CAPTCHATUNNEL_TLS_CERT: /etc/captchatunnel/tls/server.crt
      CAPTCHATUNNEL_TLS_KEY: /etc/captchatunnel/tls/server.key
    ports:
      - "4443:4443"
      - "2086:8080"
      - "10000-10100:10000-10100"